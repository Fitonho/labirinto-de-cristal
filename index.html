<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Labirinto de Cristal</title>
</head>

<body>
    <main>
        <header>
            <h1 data-text="title">Labirinto de Cristal</h1>
            <button id="language" type="button" class="link" data-text="language">English</button>
        </header>
        <div id="board" aria-label="board"></div>
        <p id="status" aria-live="polite"></p>
        <div class="controls">
            <select id="level-select" aria-label="level"></select>
            <button id="undo" type="button" data-text="undo">Desfazer</button>
            <button id="reset" type="button" data-text="reset">Recomeçar</button>
        </div>
        <p class="help" data-text="help"></p>
    </main>
    <script src="main.js" type="module"></script>
</body>

</html>
